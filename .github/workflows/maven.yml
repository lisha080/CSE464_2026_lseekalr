name: Java CI

on:
  push:
    branches: [ main, bfs, dfs ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '18'
          distribution: 'temurin'

      - name: Install Graphviz
        run: sudo apt-get install -y Graphviz

      - name: Build with Maven
        run: mvn -B package
